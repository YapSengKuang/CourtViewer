name: Project checks

on:
  push:
    branches: [main, codex/sprint-1, codex/sprint-2, codex/sprint-3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+psycopg://golf:golf@localhost:5432/teetimes_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: golf
          POSTGRES_PASSWORD: golf
          POSTGRES_DB: teetimes_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './db[dev]' -e './scraper[dev]' -e './api[dev]'
      - run: alembic -c db/alembic.ini upgrade head
      # Preflight connection prevents unavailable Postgres from looking like a pass.
      - run: python -c 'from sqlalchemy import text; from golfdb.session import get_engine; c = get_engine().connect(); c.execute(text("SELECT 1")); c.close()'
      - run: python -m pytest db/tests scraper/tests api/tests -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: test -s out/index.html

name: Collect Freeway daily

on:
  workflow_dispatch:
  schedule:
    # 20:17 AEST / 21:17 AEDT. The database guard permits one Melbourne-day attempt.
    - cron: '17 10 * * *'

permissions:
  contents: read

concurrency:
  group: hosted-golf-collection
  cancel-in-progress: false

jobs:
  collect:
    if: github.event.repository.private == false && vars.FREEWAY_COLLECTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./db -e ./scraper
      - name: Collect agreed Freeway pages at most once daily
        env:
          DATABASE_URL: ${{ secrets.GOLF_DATABASE_URL }}
          COURSES_YAML: scraper/courses.freeway-live.yaml
        run: |
          test -n "$DATABASE_URL"
          python -m golfdb.preflight "$COURSES_YAML"
          python -m golf_scraper.daily_freeway

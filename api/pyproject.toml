[project]
name = "tee-api"
version = "0.3.0"
description = "FastAPI search API. Reads tee times from Postgres."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "golfdb",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.uv.sources]
golfdb = { path = "../db", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

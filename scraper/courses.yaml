# Course catalog and scraper config.
#
# booking_url and params are intentionally empty. Real booking URLs and
# platform request settings get filled in after each site is inspected.
# Do not guess them.
#
# platform:
#   example_platform — shared booking platform. spiders/example_platform.py
#     loops every course with this value. The spider is still a fixture stub.
#     Rename the platform id once the real one is known.
#   custom — bespoke site. Spider module is spiders/custom_<id>.py with
#     hyphens in the id turned into underscores.
#
# `id` is the stable slug stored on courses.slug. `params` is read by spiders
# from this file and is not a database column.

courses:
  - id: club-mandalay
    name: Club Mandalay
    address: 486 Mandalay Circuit, Beveridge, Victoria 3753
    lat: null
    lng: null
    holes_options: [9, 18]
    platform: miclub
    timezone: Australia/Melbourne
    booking_url: https://mandalay.miclub.com.au/guests/bookings/ViewPublicCalendar.msp?booking_resource_id=3000000
    # Fee groups are the ids from the public calendar's timesheet links.
    params:
      base_url: https://mandalay.miclub.com.au
      booking_resource_id: "3000000"
      fee_groups:
        - id: "5453317"
          holes: 18
        - id: "5453680"
          holes: 9

  - id: stub-north
    name: Stub Course North
    address: null
    lat: null
    lng: null
    holes_options: [9, 18]
    platform: example_platform
    timezone: America/Los_Angeles
    booking_url: null
    # TODO: platform request settings, e.g. club_id, after inspecting the site.
    params: {}


[project]
name = "golf-scraper"
version = "0.2.0"
description = "Scheduled tee-time scrapers."
requires-python = ">=3.11"
dependencies = [
    "scrapy>=2.11",
    "golfdb",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
golfdb = { path = "../db", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

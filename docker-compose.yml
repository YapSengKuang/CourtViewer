name: teetimes

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: golf
      POSTGRES_PASSWORD: golf
      POSTGRES_DB: teetimes
    ports:
      - "5432:5432"
    volumes:
      - teetimes_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golf -d teetimes"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  teetimes_pg:
